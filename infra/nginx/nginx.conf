# RA Community Management System — Nginx Configuration
#
# Security hardening applied:
#   SSL-3: HTTP port 80 only serves ACME challenge + redirects all other traffic to HTTPS.
#   SSL-4: Mozilla Intermediate cipher suite (forward secrecy on all connections).
#   SSL-5: OCSP stapling enabled to avoid per-handshake CA lookups.
#   SSL-6: Wildcard CORS header removed — CORS handled by FastAPI middleware only.
#
# Canonical cert paths (all providers write here):
#   /etc/nginx/ssl/fullchain.pem
#   /etc/nginx/ssl/privkey.pem

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream web {
    server web:3000;
    keepalive 32;
}

# ── Shared proxy header map ────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP — ACME challenge only + HTTPS redirect (SSL-3) ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 10M;

    # Let's Encrypt HTTP-01 challenge — must remain on port 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # SSL-3: Redirect all other HTTP traffic to HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (SSL-3,4,5 hardened) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    client_max_body_size 10M;

    # ── Certificate (unified path — same for LE, Cloudflare, and custom) ──────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── SSL-4: Mozilla Intermediate profile ───────────────────────────────────
    # Allows TLS 1.2 + 1.3 with forward-secrecy cipher suites only.
    # Reference: https://ssl-config.mozilla.org/#server=nginx&config=intermediate
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;  # TLS 1.3 manages this; off lets client pick best

    # ── Session resumption (performance) ──────────────────────────────────────
    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:10m;  # ~40,000 sessions
    ssl_session_tickets  off;             # Disable — tickets undermine forward secrecy

    # ── SSL-5: OCSP Stapling ───────────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;
    # ssl_trusted_certificate: set to the CA chain if using a custom/Cloudflare cert
    # ssl_trusted_certificate /etc/nginx/ssl/fullchain.pem;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # SSL-6: NO wildcard CORS header here — FastAPI CORS middleware handles it correctly.

    # ── Backend API proxy ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SSL-6: NO 'Access-Control-Allow-Origin: *' — FastAPI sets correct CORS headers
    }

    # ── Static file uploads ────────────────────────────────────────────────────
    location /uploads/ {
        alias   /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Prevent browsers from executing uploaded files as scripts
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type application/octet-stream;
    }

    # ── Web frontend proxy ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
